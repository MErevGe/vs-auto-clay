name: Release

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed vX.Y.Z tag (leave empty to preview the latest main build)'
        type: string
        required: false
      dry_run:
        description: 'Validate and download the package without publishing a release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.workflow_run.head_branch || 'preview' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
      artifact_id: ${{ steps.prepare.outputs.artifact_id }}
      run_id: ${{ steps.prepare.outputs.run_id }}
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the signed tag and trusted build
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/scripts/release.py prepare

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact_id }}
          run-id: ${{ steps.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-artifact
          merge-multiple: true

      - name: Verify package contents, checksum and source commit
        env:
          SOURCE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: python3 .github/scripts/release.py check

  publish:
    name: Publish GitHub release
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-artifact
          merge-multiple: true

      - name: Publish the verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check --strict SHA256SUMS
          gh release create "$RELEASE_TAG" "vsautoclay_$RELEASE_VERSION.zip" SHA256SUMS \
            --verify-tag --target "$SOURCE_COMMIT" --title "Auto Clay $RELEASE_VERSION" --generate-notes
