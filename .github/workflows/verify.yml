name: Verify

on:
  push:
    branches:
      - main
      - security/harden-repository
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification-tools"
          cd "$RUNNER_TEMP/verification-tools"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP/verification-tools" >> "$GITHUB_PATH"

      - name: Validate workflows and scan committed history
        run: |
          actionlint -shellcheck= -pyflakes=
          gitleaks git --redact --no-banner --log-opts=--all .
          git diff --check

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

      - name: Select code analysis
        id: analysis
        shell: bash
        run: |
          if test -f AutoClay/AutoClay.csproj; then
            echo 'language=csharp' >> "$GITHUB_OUTPUT"
            echo 'build-mode=manual' >> "$GITHUB_OUTPUT"
            echo 'checksum=f012adbe9ec6e3ce1e662c45592db4a6b9bed177395b1c7bccb93bb348ff9630' >> "$GITHUB_OUTPUT"
          else
            echo 'language=actions' >> "$GITHUB_OUTPUT"
            echo 'build-mode=none' >> "$GITHUB_OUTPUT"
            echo 'checksum=71247327cf3afe4115acc546fe3ac77f2865928205d7688d6a0b7153e055603f' >> "$GITHUB_OUTPUT"
          fi

      - name: Download pinned CodeQL bundle
        env:
          CODEQL_LANGUAGE: ${{ steps.analysis.outputs.language }}
          CODEQL_CHECKSUM: ${{ steps.analysis.outputs.checksum }}
        run: |
          curl --fail --silent --show-error --location --retry 3 "https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-$CODEQL_LANGUAGE-linux64.tar.zst" -o "$RUNNER_TEMP/codeql-bundle.tar.zst"
          echo "$CODEQL_CHECKSUM  $RUNNER_TEMP/codeql-bundle.tar.zst" | sha256sum --check --strict

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          tools: ${{ runner.temp }}/codeql-bundle.tar.zst
          languages: ${{ steps.analysis.outputs.language }}
          build-mode: ${{ steps.analysis.outputs.build-mode }}
          queries: security-extended

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.analysis.outputs.language == 'csharp'
        with:
          dotnet-version: 10.0.401

      - name: Download Vintage Story build references
        if: steps.analysis.outputs.language == 'csharp'
        run: |
          curl --fail --silent --show-error --location --retry 3 https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.7.tar.gz -o "$RUNNER_TEMP/vintagestory.tar.gz"
          echo "a7d4a520604590a96de812ee6c6baf4404d43d86cf1ec4fbac1b3a580b52c847  $RUNNER_TEMP/vintagestory.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vintagestory"
          tar -xzf "$RUNNER_TEMP/vintagestory.tar.gz" -C "$RUNNER_TEMP/vintagestory"
          echo "VINTAGE_STORY=$RUNNER_TEMP/vintagestory" >> "$GITHUB_ENV"

      - name: Restore locked dependencies and audit vulnerabilities
        if: steps.analysis.outputs.language == 'csharp'
        run: dotnet restore AutoClay.sln --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate -warnaserror

      - name: Check formatting and compile with analyzers
        if: steps.analysis.outputs.language == 'csharp'
        run: |
          dotnet format AutoClay.sln --verify-no-changes --no-restore
          dotnet build AutoClay.sln -c Release --no-restore

      - name: Run tests and enforce line and branch coverage
        if: steps.analysis.outputs.language == 'csharp'
        run: dotnet test AutoClay.Tests/AutoClay.Tests.csproj -c Release --no-build --no-restore

      - name: Verify raw coverage measurements
        if: steps.analysis.outputs.language == 'csharp'
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('AutoClay.Tests/TestResults/coverage.cobertura.xml').getroot()
          for kind, threshold in [('lines', 0.90), ('branches', 0.80)]:
              covered = int(report.attrib[f'{kind}-covered'])
              valid = int(report.attrib[f'{kind}-valid'])
              if valid == 0 or covered / valid < threshold:
                  raise SystemExit(f'{kind} coverage below {threshold:.0%}: {covered}/{valid}')
              print(f'{kind}: {covered}/{valid} = {covered / valid:.2%}')
          PY

      - name: Package the production mod
        if: steps.analysis.outputs.language == 'csharp'
        run: ./build.sh

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          upload: false
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce code security findings
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          reports = list((Path(os.environ['RUNNER_TEMP']) / 'codeql-results').glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL produced no SARIF reports')
          failures = []
          for report in reports:
              for run in json.loads(report.read_text())['runs']:
                  rules = {rule['id']: rule for rule in run['tool']['driver'].get('rules', [])}
                  for result in run.get('results', []):
                      rule = rules.get(result.get('ruleId'), {})
                      score = rule.get('properties', {}).get('security-severity')
                      if (score is not None and float(score) >= 4) or (score is None and result.get('level', 'warning') in ('error', 'warning')):
                          failures.append(result.get('ruleId', 'unknown'))
                      else:
                          print(f"Informational finding: {result.get('ruleId', 'unknown')}")
          if failures:
              raise SystemExit('Blocking CodeQL findings: ' + ', '.join(failures))
          print('No blocking CodeQL findings')
          PY
